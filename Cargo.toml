[package]
name = "easytk"
version = "0.0.1"
authors = ["Artem V. Ageev <artem.v.ageev@gmail.com>"]
license = "LGPL-2.1-only"
repository = "https://github.com/theavege/easytk-rs"
description = "A component model for FLTK and GTK applications"
keywords = ["gui", "fltk", "gtk", "components"]
categories = ["gui"]
readme = "README.md"
edition = "2024"
rust-version = "1.85"
exclude = ["assets"]

[features]
default = []
reqwest = ["dep:reqwest"]

[target.'cfg(windows)'.dependencies]
fltk = { version = "1.5"}

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.19"}

[dependencies]
reqwest = { version = "0.13", features = ["json", "native-tls", "blocking"], optional = true }

[[example]]
name = "simple"
required-features = ["reqwest"]
